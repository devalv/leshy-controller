name: eBPF C Code Security Scan

on:
  pull_request:
    paths:
      - 'cbpf/**'

permissions:
  contents: read

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST Scan
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          # Несколько наборов правил
          config: |
            p/c
            p/security-audit
            p/best-practices
          # Только для C файлов
          paths: cbpf/
          # Опции сканирования
          disable-nosem: true
          no-git-ignore: true
          # Дополнительные опции
          extra-args: "--metrics=off"
