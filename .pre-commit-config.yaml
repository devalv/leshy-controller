repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: mixed-line-ending
  - repo: local
    hooks:
    - id: advanced-fmt
      name: advanced-fmt
      entry: make fmt
      language: system
      types: [go]
